<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Paragraphs</title></head>
<body>
  <p>This is the first paragraph. Extra spaces and line breaks in the source collapse to one space.</p>
  <p>This is the second paragraph. The browser adds margin between paragraphs.</p>
  <p>Inline elements are fine: <strong>bold</strong>, <em>italic</em>, and <a href="#">links</a>.</p>
</body>
</html>
