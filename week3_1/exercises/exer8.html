<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 8</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      line-height: 1.7;
    }
    .nav {
      background: #1e293b;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav a { color: white; text-decoration: none; margin-left: 18px; }
    .hero {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }
    .hero h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }
    .hero p {
      font-size: 1.1rem;
      color: #475569;
      max-width: 520px;
    }
    .btn {
      display: inline-block;
      background: #15803d;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      margin-top: 20px;
    }
    .skills {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto 50px;
      padding: 0 20px;
    }
    .skill {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 6px 18px rgba(15,23,42,0.05);
    }
    footer {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div><strong>My Portfolio</strong></div>
    <div>
      <a href="#">Home</a>
      <a href="#">Skills</a>
      <a href="#">About</a>
    </div>
  </nav>

  <section class="hero">
    <div>
      <h1>Hi, I am Jisoo.</h1>
      <p>I build modern web pages with HTML, CSS, and user-friendly design.</p>
      <a class="btn" href="#">View Work</a>
    </div>
    <div>
      <img src="https://via.placeholder.com/300x220/15803d/ffffff?text=Profile" alt="profile" style="border-radius:12px;" />
    </div>
  </section>

  <section class="skills">
    <div class="skill"><h3>HTML</h3><p>Semantics and structure.</p></div>
    <div class="skill"><h3>CSS</h3><p>Layout, colors, and spacing.</p></div>
    <div class="skill"><h3>Flexbox</h3><p>Responsive and clean design.</p></div>
  </section>

  <footer>
    © 2026 My Portfolio
  </footer>
</body>
</html>
