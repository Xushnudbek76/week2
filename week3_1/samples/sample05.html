<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 05 - ID Selector</title>
  <style>
    #main-title {
      color: #15803d;
      font-size: 2.5rem;
      border-left: 5px solid #10B981;
      padding-left: 12px;
    }

    #hero-banner {
      background: #ecfdf5;
      padding: 40px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div id="hero-banner">
    <h1 id="main-title">CSS Introduction</h1>
    <p>This heading is styled via its unique id.</p>
  </div>
</body>
</html>
