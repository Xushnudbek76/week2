<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 04 - Universal Selector</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      line-height: 1.6;
      background: #f8fafc;
      color: #1e293b;
    }

    .card {
      background: #fff;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      margin: 20px auto;
      padding: 20px;
      width: 320px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Universal Selector Reset</h2>
    <p>Padding and border are included in width using box-sizing: border-box.</p>
  </div>
</body>
</html>
