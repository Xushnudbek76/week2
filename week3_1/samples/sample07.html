<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 07 - Type Selector</title>
  <style>
    h1 { color: #15803d; }
    h2 { color: #1d4ed8; font-size: 1.4rem; }
    p { font-size: 1rem; line-height: 1.7; color: #334155; }
    a { color: #10B981; text-decoration: none; }
    a:hover { text-decoration: underline; }
    p.lead { font-size: 1.2rem; font-weight: 500; }
  </style>
</head>
<body>
  <h1>Main Heading</h1>
  <h2>Sub Heading</h2>
  <p class="lead">Lead paragraph</p>
  <p>Normal paragraph with <a href="#">a link</a>.</p>
</body>
</html>
