<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 17 - Margin</title>
  <style>
    .box {
      background: #ecfdf5;
      border: 2px solid #10B981;
      padding: 12px;
      width: 280px;
    }
    .m-all { margin: 20px; }
    .m-auto { margin: 0 auto; }
    .p1 { margin-bottom: 20px; background: #fef3c7; padding: 8px; }
    .p2 { margin-top: 30px; background: #dbeafe; padding: 8px; }
  </style>
</head>
<body>
  <div class="box m-all">Margin: 20px</div>
  <div class="box m-auto">margin: 0 auto</div>
  <p class="p1">margin-bottom: 20px</p>
  <p class="p2">margin-top: 30px</p>
</body>
</html>
