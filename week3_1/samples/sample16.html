<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 16 - Padding</title>
  <style>
    .box {
      background: #ecfdf5;
      border: 2px solid #10B981;
      width: 300px;
      font-family: sans-serif;
    }
    .p-none { padding: 0; }
    .p-all { padding: 20px; }
    .p-tb-lr { padding: 10px 40px; }
  </style>
</head>
<body>
  <div class="box p-none">padding: 0</div>
  <div class="box p-all">padding: 20px</div>
  <div class="box p-tb-lr">padding: 10px 40px</div>
</body>
</html>
