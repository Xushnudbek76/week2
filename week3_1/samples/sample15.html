<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 15 - text-align</title>
  <style>
    .left { text-align: left; }
    .center { text-align: center; }
    .right { text-align: right; }
    .justify { text-align: justify; }
    div {
      border: 1px dashed #cbd5e1;
      padding: 12px;
      margin: 8px 0;
      max-width: 500px;
    }
    .centered-box {
      width: 300px;
      margin: 0 auto;
      background: #ecfdf5;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="left">text-align: left</div>
  <div class="center">text-align: center</div>
  <div class="right">text-align: right</div>
  <div class="justify">text-align: justify stretches the text across the whole width of the container.</div>
  <div class="centered-box">This box is centered on the page.</div>
</body>
</html>
