<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 12 - font-size</title>
  <style>
    html { font-size: 100%; }
    .px-example { font-size: 18px; }
    .rem-example { font-size: 1.5rem; }
    .parent { font-size: 20px; }
    .child-em { font-size: 1.5em; }
    .small { font-size: 0.875rem; }
    .base { font-size: 1rem; }
    .large { font-size: 1.25rem; }
    .xl { font-size: 1.5rem; }
    .xxl { font-size: 2rem; }
  </style>
</head>
<body>
  <p class="small">0.875rem</p>
  <p class="base">1rem</p>
  <p class="large">1.25rem</p>
  <p class="xl">1.5rem</p>
  <p class="xxl">2rem</p>
</body>
</html>
