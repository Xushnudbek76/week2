<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 11 - RGB Colors</title>
  <style>
    .ex1 { background-color: rgb(255, 0, 0); color: white; }
    .ex2 { background-color: rgb(21, 128, 61); color: white; }
    .ex3 { background-color: rgb(29, 78, 216); color: white; }
    .overlay {
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 20px;
    }
    .glass {
      background-color: rgba(21, 128, 61, 0.15);
      border: 1px solid rgba(21, 128, 61, 0.4);
      padding: 12px;
    }
    div { padding: 8px 16px; margin: 6px; }
  </style>
</head>
<body>
  <div class="ex1">rgb(255, 0, 0)</div>
  <div class="ex2">rgb(21, 128, 61)</div>
  <div class="ex3">rgb(29, 78, 216)</div>
  <div class="overlay">rgba(0,0,0,0.5)</div>
  <div class="glass">Translucent green</div>
</body>
</html>
