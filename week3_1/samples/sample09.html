<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 09 - background-color Property</title>
  <style>
    .banner {
      background-color: #15803d;
      color: white;
      padding: 20px 30px;
      border-radius: 8px;
    }
    .warning {
      background-color: #fef3c7;
      color: #92400e;
      padding: 12px 16px;
      border-left: 4px solid #f59e0b;
    }
    .dark-card {
      background-color: #1e293b;
      color: #e2e8f0;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="banner">Green banner with white text</div>
  <br />
  <div class="warning">Warning box</div>
  <br />
  <div class="dark-card">Dark card</div>
</body>
</html>
