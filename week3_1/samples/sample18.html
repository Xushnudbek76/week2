<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 18 - Box Model Width</title>
  <style>
    .content-box {
      box-sizing: content-box;
      width: 200px;
      padding: 10px;
      border: 5px solid #10B981;
      background: #ecfdf5;
      margin-bottom: 16px;
    }
    .border-box {
      box-sizing: border-box;
      width: 200px;
      padding: 10px;
      border: 5px solid #7c3aed;
      background: #f5f3ff;
    }
    p { font-size: 13px; color: #475569; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="content-box">content-box</div>
  <p>Actual width = 200 + 20 + 10 = 230px</p>

  <div class="border-box">border-box</div>
  <p>Actual width = exactly 200px</p>
</body>
</html>
