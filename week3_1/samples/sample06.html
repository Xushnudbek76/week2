<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 06 - Class Selector</title>
  <style>
    .card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      margin: 10px;
    }

    .featured {
      border-color: #10B981;
      background: #ecfdf5;
    }

    .large { font-size: 1.25rem; }
  </style>
</head>
<body>
  <div class="card">Plain card</div>
  <div class="card featured">Featured card</div>
  <div class="card featured large">Featured + large</div>
</body>
</html>
