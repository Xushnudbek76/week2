<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 20 - display: none</title>
  <style>
    .box { padding: 16px; margin: 8px 0; border: 2px solid #10B981; }
    .hidden-none { display: none; }
    .hidden-visibility { visibility: hidden; }
    .hidden-opacity { opacity: 0; }
  </style>
</head>
<body>
  <div class="box">Box 1 — visible</div>
  <div class="box hidden-none">Box 2 — display:none</div>
  <div class="box">Box 3 — visible</div>
  <div class="box hidden-visibility">Box 4 — visibility:hidden</div>
  <div class="box">Box 5 — visible</div>
</body>
</html>
