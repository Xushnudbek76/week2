<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 03 - Fixed & Sticky</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; background: #0f172a; color: white;
      padding: 16px 24px; z-index: 100;
    }
    .content { padding-top: 72px; }
    .sticky { position: sticky; top: 64px; background: #ccfbf1; padding: 12px 20px; font-weight: bold; color: #0f766e; border-left: 4px solid #14b8a6; }
    .section { height: 260px; padding: 18px 20px; background: #f0fdfa; margin: 0 0 20px; }
  </style>
</head>
<body>
  <nav class="topbar">Xushnudbek's Fixed Nav</nav>
  <div class="content">
    <div class="sticky">Section A</div>
    <div class="section">This section stays in the flow until it reaches the sticky threshold.</div>
    <div class="sticky">Section B</div>
    <div class="section">Scroll again and the second sticky label will lock in place.</div>
  </div>
</body>
</html>
