<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 01 - Static & Relative</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0fdfa; padding: 30px; }
    .box {
      width: 140px; height: 70px; background: #0f766e; color: white; margin: 12px;
      padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    }
    .relative {
      position: relative; top: 24px; left: 30px; background: #14b8a6;
    }
  </style>
</head>
<body>
  <div class="box">Static</div>
  <div class="box relative">Relative</div>
  <div class="box">Next box</div>
</body>
</html>
