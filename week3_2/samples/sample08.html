<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 08 - Keyframes</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #ecfeff; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .hero { animation: fadeSlide 0.8s ease-out forwards; font-size: 28px; font-weight: bold; color: #0f766e; }
    .badge { display: inline-block; background: #0f766e; color: white; padding: 8px 18px; border-radius: 999px; animation: pulse 1.5s ease-in-out infinite; margin-top: 16px; }
    .spinner { width: 42px; height: 42px; border: 4px solid #ccfbf1; border-top-color: #0f766e; border-radius: 50%; animation: spin 0.8s linear infinite; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="hero">Hello, Xushnudbek!</div>
  <div class="badge">Live</div>
  <div class="spinner"></div>
</body>
</html>
