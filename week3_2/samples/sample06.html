<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 06 - Pseudo Elements</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    h2::before { content: '🌿 '; }
    .required::after { content: ' *'; color: #ef4444; font-weight: bold; }
    .underline { position: relative; display: inline-block; padding-bottom: 8px; }
    .underline::after { content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background: #0f766e; border-radius: 999px; }
    blockquote { position: relative; padding-left: 34px; font-style: italic; }
    blockquote::before { content: '"'; position: absolute; left: 0; top: -8px; font-size: 52px; color: #14b8a6; }
  </style>
</head>
<body>
  <h2>CSS Pseudo Elements</h2>
  <p><label class="required">Email</label></p>
  <p class="underline">Decorative Underline</p>
  <blockquote>Learning CSS is both creative and practical for Xushnudbek.</blockquote>
</body>
</html>
