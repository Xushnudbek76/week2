<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 12 - CSS Grid</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f0fdfa; }
    .page {
      display: grid; min-height: 300px; grid-template-areas: "header header header" "sidebar main main" "footer footer footer";
      grid-template-columns: 180px 1fr 1fr; grid-template-rows: auto 1fr auto; gap: 12px;
    }
    .page > * { border-radius: 8px; padding: 16px; }
    header { grid-area: header; background: #0f766e; color: white; }
    .sidebar { grid-area: sidebar; background: #ccfbf1; color: #0f766e; }
    main { grid-area: main; background: white; border: 2px solid #14b8a6; }
    footer { grid-area: footer; background: #1e293b; color: #cbd5e1; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
    .cards div { background: #0f766e; color: white; padding: 16px; border-radius: 6px; text-align: center; }
  </style>
</head>
<body>
  <div class="page">
    <header>Header</header>
    <div class="sidebar">Sidebar</div>
    <main>Main content for Xushnudbek</main>
    <footer>Footer</footer>
  </div>
  <div class="cards">
    <div>Card 1</div><div>Card 2</div><div>Card 3</div>
    <div>Card 4</div><div>Card 5</div><div>Card 6</div>
  </div>
</body>
</html>
