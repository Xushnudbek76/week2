<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 05 - Pseudo Classes</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .btn { background: #0f766e; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #14b8a6; transform: translateY(-2px); }
    .btn:active { transform: scale(0.97); }
    input { border: 2px solid #cbd5e1; padding: 10px 12px; border-radius: 8px; outline: none; }
    input:focus-visible { border-color: #0f766e; box-shadow: 0 0 0 4px rgba(20,184,166,0.25); }
    table { width: 260px; border-collapse: collapse; margin-top: 20px; }
    td { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; }
    tr:nth-child(even) { background: #f0fdfa; }
    tr:first-child { background: #0f766e; color: white; }
  </style>
</head>
<body>
  <button class="btn">Hover Me</button>
  <br><br>
  <input type="text" placeholder="Tab to focus" />
  <table>
    <tr><td>Name</td><td>Score</td></tr>
    <tr><td>Xushnudbek</td><td>98</td></tr>
    <tr><td>Nargiza</td><td>87</td></tr>
  </table>
</body>
</html>
