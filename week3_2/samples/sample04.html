<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 04 - Z-index & Overflow</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f8fafc; }
    .stack { position: relative; height: 180px; }
    .layer { position: absolute; width: 180px; height: 100px; border-radius: 10px; padding: 12px; color: white; }
    .layer1 { background: #0f766e; top: 20px; left: 20px; z-index: 1; }
    .layer2 { background: #14b8a6; top: 60px; left: 90px; z-index: 2; }
    .layer3 { background: #0f172a; top: 100px; left: 160px; z-index: 3; }
    .overflow-demo {
      width: 220px; height: 100px; border: 2px solid #14b8a6; overflow: hidden; padding: 10px; margin-top: 30px;
      background: #ecfeff; line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="stack">
    <div class="layer layer1">Layer 1</div>
    <div class="layer layer2">Layer 2</div>
    <div class="layer layer3">Layer 3</div>
  </div>
  <div class="overflow-demo">This text is longer than the box. Overflow hidden clips the extra content.</div>
</body>
</html>
