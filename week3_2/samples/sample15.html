<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample 15 - Combined Layout</title>
  <style>
    :root {
      --primary: #0f766e;
      --accent: #14b8a6;
      --bg: #f0fdfa;
      --card: #ffffff;
      --text: #1e293b;
      --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .card { position: relative; background: var(--card); border: 2px solid #e2e8f0; border-radius: var(--radius); padding: 24px; transition: transform .25s ease, box-shadow .25s ease, border-color .25s; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 12px 32px rgba(15,118,110,0.18); border-color: var(--accent); }
    .badge { position: absolute; top: -10px; right: 16px; background: var(--primary); color: white; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .card-title::before { content: '⭐ '; }
    .card-title { color: var(--primary); font-size: 18px; margin-bottom: 10px; }
    .card-desc { color: #64748b; line-height: 1.6; }
    .card-price { margin-top: 14px; font-size: 22px; font-weight: 700; color: var(--primary); }
  </style>
</head>
<body>
  <div class="grid">
    <article class="card"><span class="badge">NEW</span><h3 class="card-title">CSS Course</h3><p class="card-desc">Learn selectors, layouts, advanced styling.</p><div class="card-price">₩49,000</div></article>
    <article class="card"><h3 class="card-title">JS Bootcamp</h3><p class="card-desc">Build dynamic interfaces with modern JavaScript.</p><div class="card-price">₩69,000</div></article>
    <article class="card"><span class="badge">HOT</span><h3 class="card-title">Full Stack</h3><p class="card-desc">Combine HTML, CSS, JS, and backend skills.</p><div class="card-price">₩129,000</div></article>
  </div>
</body>
</html>
