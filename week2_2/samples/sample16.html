<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Block Quotation</title></head>
<body>
  <article>
    <h2>On the Web</h2>
    <p>The inventor of the web described his vision:</p>
    <blockquote cite="https://www.w3.org/People/Berners-Lee/FAQ.html">
      <p>The original idea of the web was a collaborative space where people share information.</p>
      <footer>- <cite>Tim Berners-Lee</cite>, W3C Director</footer>
    </blockquote>
  </article>
</body>
</html>
