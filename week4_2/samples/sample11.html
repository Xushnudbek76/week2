<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Sample 11 | createElement</title><link rel="stylesheet" href="../style.css"></head>
<body><main><a class="back" href="../index.html">Back to Week 4</a><p class="eyebrow">Sample 11 · Dynamic DOM</p><h1>createElement and append</h1><p class="lede">Create a node, set its content, then append it to a parent already in the document.</p>
<section class="panel"><div class="controls"><input id="item-text" value="Learn HTML" aria-label="New list item"><button id="add" type="button">Add item</button></div><ul id="items" class="list"><li>Example item</li></ul><p id="count" class="output" aria-live="polite">1 item</p></section>
<script>
const items = document.querySelector('#items');
document.querySelector('#add').addEventListener('click', () => {
  const text = document.querySelector('#item-text').value.trim();
  if (!text) return;
  const item = document.createElement('li');
  item.textContent = text;
  items.appendChild(item);
  document.querySelector('#count').textContent = `${items.children.length} items`;
});
</script></main></body></html>
