<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Sample 06 | classList</title><link rel="stylesheet" href="../style.css"><style>.highlight { padding: 16px; border: 2px solid #d28a32; border-radius: 12px; font-weight: 700; }.rounded { border-radius: 24px; }.shadowed { box-shadow: 0 8px 18px rgb(0 0 0 / 18%); }.big { font-size: 1.3rem; }</style></head>
<body><main><a class="back" href="../index.html">Back to Week 4</a><p class="eyebrow">Sample 06 · Changing content</p><h1>classList</h1><p class="lede">Let CSS define how a class looks, then add, remove, or toggle it from JavaScript.</p>
<section class="panel"><div id="target" class="demo-box">I am the demo box.</div><div class="controls"><button data-action="add" type="button">Add highlight</button><button data-action="remove" class="secondary" type="button">Remove highlight</button><button data-action="rounded" type="button">Toggle rounded</button><button data-action="shadowed" type="button">Toggle shadow</button><button data-action="big" type="button">Toggle size</button></div><p id="classes" class="output" aria-live="polite"></p></section>
<script>
const target = document.querySelector('#target');
const update = () => { document.querySelector('#classes').textContent = `Classes: ${target.className || '(none)'}`; };
document.querySelectorAll('[data-action]').forEach((button) => button.addEventListener('click', () => {
  const action = button.dataset.action;
  if (action === 'add') target.classList.add('highlight');
  else if (action === 'remove') target.classList.remove('highlight');
  else target.classList.toggle(action);
  update();
}));
update();
</script></main></body></html>
