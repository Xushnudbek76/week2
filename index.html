<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Weekly Homework</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f6f2;
      --surface: #ffffff;
      --ink: #19251f;
      --muted: #627067;
      --line: #dce4dc;
      --accent: #176a50;
      --accent-soft: #e7f2ec;
      --highlight: #d49b42;
      --shadow: 0 12px 34px rgb(25 37 31 / 7%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #151b18;
        --surface: #202925;
        --ink: #edf3ee;
        --muted: #a9b7ad;
        --line: #39463e;
        --accent: #80c6a5;
        --accent-soft: #293d33;
        --highlight: #e5b65f;
        --shadow: 0 12px 34px rgb(0 0 0 / 20%);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        linear-gradient(135deg, transparent 0 74%, rgb(23 106 80 / 4%) 74% 75%, transparent 75%),
        var(--page);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    main {
      width: min(100% - 40px, 1040px);
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 32px;
      padding: 0 4px 24px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 750;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 500;
      line-height: 1.08;
    }

    .student {
      flex: 0 0 auto;
      padding-left: 20px;
      border-left: 3px solid var(--highlight);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .student strong {
      display: block;
      color: var(--ink);
      font-size: 1rem;
    }

    .weeks {
      display: grid;
      gap: 20px;
    }

    .week {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .week-heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 0;
      padding: 19px 24px;
      border-bottom: 1px solid var(--line);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.45rem;
      font-weight: 500;
    }

    .week-heading a {
      color: inherit;
      text-decoration: none;
    }

    .week-heading a:hover { color: var(--accent); }

    .week-heading span {
      color: var(--accent);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 750;
      text-transform: uppercase;
    }

    .groups {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
      padding: 22px 24px 26px;
    }

    .group h3 {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
      text-transform: uppercase;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 7px 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    a {
      display: inline-block;
      max-width: 100%;
      color: var(--accent);
      font-size: 0.9rem;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    a:hover { color: var(--highlight); }
    a:focus-visible { outline: 2px solid var(--highlight); outline-offset: 3px; }

    @media (max-width: 620px) {
      main { width: min(100% - 24px, 1040px); padding-top: 32px; }
      .masthead { align-items: flex-start; flex-direction: column; gap: 18px; }
      .student { padding-left: 12px; }
      .groups { grid-template-columns: 1fr; gap: 22px; padding: 20px; }
      .week-heading { padding: 17px 20px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <p class="eyebrow">Coursework index</p>
        <h1>Weekly Homework</h1>
      </div>
      <div class="student"><strong>Xushnudbek</strong>Teacher Assistant<br>202537260<br>Gachon University</div>
    </header>

    <div class="weeks">
      <section class="week">
        <h2 class="week-heading"><a href="week2_1/">Week 2 - Part 1</a></h2>
      </section>
      <section class="week">
        <h2 class="week-heading"><a href="week2_2/">Week 2 - Part 2</a></h2>
      </section>
      <section class="week">
        <h2 class="week-heading"><a href="week3_1/">Week 3 - Part 1</a></h2>
      </section>
      <section class="week">
        <h2 class="week-heading"><a href="week3_2/">Week 3 - Part 2</a></h2>
      </section>
      <section class="week">
        <h2 class="week-heading"><a href="week4_2/">Week 4 - Part 2</a></h2>
      </section>
    </div>
  </main>
</body>
</html>
